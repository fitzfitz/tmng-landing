name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      # Shared Package Build
      - name: Build Shared
        run: pnpm --filter @tmng/shared build

      # API Deploy (Worker)
      - name: Deploy API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tmng-landing-api
          command: deploy

      # Frontend Build
      - name: Debug Environment
        run: |
          if [ -z "${{ secrets.VITE_API_URL || vars.VITE_API_URL }}" ]; then
            echo "::error::VITE_API_URL is missing or empty!"
            exit 1
          else
            echo "VITE_API_URL is set (length: ${#VITE_API_URL})"
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      - name: Build Frontend
      
        run: pnpm --filter @tmng/landing build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      # Frontend Deploy (Pages)
      - name: Deploy Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tmng-landing
          command: pages deploy dist --project-name=tmng-landing
